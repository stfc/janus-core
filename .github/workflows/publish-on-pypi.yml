name: Publish on PyPI

on:
  push:
    tags:
      # After vMajor.Minor.Patch _anything_ is allowed (without "/") !
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  build-docs:
    runs-on: ubuntu-latest
    if: github.repository == 'stfc/janus-core' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: True

    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        uses: pandoc/actions/setup@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra mace --extra orb --extra chgnet

      - name: Install TDEP build dependencies
        id: tdep-deps
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libblas-dev \
            liblapack-dev \
            libhdf5-dev \
            libhdf5-serial-dev \
            libhdf5-openmpi-dev \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libscalapack-openmpi-dev

      - name: Build TDEP
        id: tdep
        if: steps.tdep-deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          # The same commit as in ci.yml
          TDEP_COMMIT: 6ccdf13ced49aa067a92f9c9b03a2a202bc361b5
        run: |
          git clone https://github.com/tdep-developers/tdep.git "$RUNNER_TEMP/tdep"
          cd "$RUNNER_TEMP/tdep"
          git checkout "$TDEP_COMMIT"
          # Production (-O3) settings from TDEP's own CI
          cp .github/important_settings.x86_64 important_settings
          bash build_things.sh --nthreads_make 4
          test -x bin/extract_forceconstants && test -x bin/phonon_dispersion_relations

      - name: Add TDEP to PATH based on build success
        run: |
          if [ "${{ steps.tdep.outcome }}" = "success" ]; then
            echo "$RUNNER_TEMP/tdep/bin" >> $GITHUB_PATH
          else
            echo "::warning title=TDEP not installed::TDEP steps in the tutorials will be skipped"
          fi

      - name: Build docs with tutorials
        run: cd docs && uv run make all

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './docs/build/html/.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.repository == 'stfc/janus-core' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
      # For release.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv build

      - name: Get version from pyproject.toml
        run: echo "VERSION=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)" >> $GITHUB_ENV

      - name: Check version matches tag
        if: ${{ ! contains(github.ref, env.VERSION) }}
        run: |
          echo "Git tag does not match version in pyproject.toml"
          exit 1

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: steps.check-prerelease.outputs.prerelease == 'true'
          skipIfReleaseExists: true
          generateReleaseNotes: true

      - name: Publish to PyPI
        run: uv publish
